name: AlGel v4 static checks
on:
  pull_request:
    paths:
      - 'v4/**'
      - '.github/workflows/algel-v4-checks.yml'
  workflow_dispatch:
jobs:
  syntax-and-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check v4/app.js
          node --check v4/tools/legacy-inventory.mjs
          node --check v4/config.js
      - name: Check UI wiring and production safety
        run: node v4/tools/static-check.mjs
