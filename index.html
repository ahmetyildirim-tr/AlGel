<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e766e"><meta name="apple-mobile-web-app-capable" content="yes"><title>AlGel | ASEM Medya</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17332f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:22px 18px 60px}.hero{background:linear-gradient(125deg,#087e73,#13544e);color:white;border-radius:0 0 30px 30px;padding:28px 24px 32px}.hero>div{max-width:600px;margin:auto}h1{font-size:34px;margin:0}h2{font-size:20px}p{line-height:1.5}.muted{color:#72827d;font-size:14px}.hero .muted{color:#d1eee7}.card{background:white;padding:20px;border-radius:20px;box-shadow:0 5px 24px #123b2b0c;margin:16px 0}input,button{font:inherit}input{width:100%;border:1px solid #d8e3dd;border-radius:13px;padding:14px;margin:6px 0 12px;background:#fff;color:#17332f}button{border:0;border-radius:13px;padding:13px 17px;background:#0b8275;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e7f1ed;color:#13665e}button.danger{background:#fff1f0;color:#b33434}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.grow{flex:1}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eef1ee}.item:last-child{border:0}.item input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:#0b8275}.item .name{flex:1;overflow-wrap:anywhere}.done .name{text-decoration:line-through;color:#8b9992}.item small{color:#81918b}.item button{padding:9px 12px}.hidden{display:none!important}#message{min-height:20px;color:#bd4141}footer{text-align:center;padding:20px;font-size:13px;color:#7a8983}a{color:#0b8275}#listStatus{font-size:13px;color:#667c73}.chip{display:inline-block;padding:5px 10px;border-radius:30px;background:#e4f5ec;color:#0a6a58;font-size:12px;font-weight:700}
</style></head><body><header class="hero"><div><h1>🛍️ AlGel</h1><p class="muted">Eve gelirken unutma. Ortak alışveriş listeniz.</p><span class="chip">ASEM Medya</span></div></header><main><section id="loginView" class="card"><h2>Hoş geldin 👋</h2><p class="muted">Aile hesabınla giriş yap.</p><form id="loginForm"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" style="width:100%">Giriş yap</button></form><p id="message" role="alert"></p></section><section id="appView" class="hidden"><div class="card"><div class="row"><div class="grow"><strong>Ortak aile listesi</strong><p id="userLabel" class="muted" style="margin:5px 0"></p></div><button id="logout" class="secondary">Çıkış</button></div><p id="listStatus">Bağlanıyor…</p></div><div class="card"><h2>Listeye ürün ekle</h2><form id="addForm"><input id="productName" maxlength="100" placeholder="Örn. Süt, ekmek, domates" required><div class="row"><input id="quantity" maxlength="40" placeholder="Miktar (örn. 2 adet)" class="grow"><button type="submit">+ Ekle</button></div></form><p id="appError" role="alert" style="color:#bd4141"></p></div><div class="card"><div class="row"><h2 class="grow">Alışveriş listesi</h2><span id="count" class="chip">0 ürün</span></div><div id="items"></div></div></section><footer>Geliştirici: <a href="https://www.asemmedya.com" target="_blank" rel="noopener noreferrer">ASEM Medya</a> · AlGel v1.0</footer></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyClAjzLsBmIaISpzVKvS_tLQQGSF_8ALGg',authDomain:'asem-algel.firebaseapp.com',projectId:'asem-algel',storageBucket:'asem-algel.firebasestorage.app',messagingSenderId:'273464507861',appId:'1:273464507861:web:6bbf2068f69dba5466d15c'};
const allowed=['S0c4ZBH285duqGh0U5gA5tVVweY2','69XsPeLgc9hlUH6UMgZMUxMv9up2'];const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),itemsRef=collection(db,'shoppingLists','family','items');const $=id=>document.getElementById(id);let unsubscribe=null;
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){$('message').textContent='Giriş yapılamadı. E-posta ve şifreni kontrol et.'}});
$('logout').addEventListener('click',()=>signOut(auth));onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const ok=user&&allowed.includes(user.uid);$('loginView').classList.toggle('hidden',!!ok);$('appView').classList.toggle('hidden',!ok);if(!ok){if(user)signOut(auth);return}$('userLabel').textContent=user.email;unsubscribe=onSnapshot(itemsRef,snap=>{const data=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.done===b.done?0:a.done?1:-1)||((a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)));render(data);$('listStatus').textContent='✓ Liste güncel · Değişiklikler anlık eşitleniyor'},()=>{$('listStatus').textContent='Liste okunamadı. Firestore kurallarını ve bağlantını kontrol et.'})});
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('productName').value.trim(),quantity=$('quantity').value.trim();if(!name)return;$('appError').textContent='';try{await addDoc(itemsRef,{name,quantity,done:false,createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});$('productName').value='';$('quantity').value=''}catch(err){$('appError').textContent='Ürün eklenemedi. Bağlantıyı veya erişim kurallarını kontrol et.'}});
function render(data){$('count').textContent=`${data.filter(x=>!x.done).length} bekleyen`;$('items').replaceChildren();if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='Liste boş. İlk ürünü ekleyin!';$('items').append(p);return}for(const item of data){const div=document.createElement('div');div.className='item'+(item.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',item.name+' alındı');check.onchange=async()=>{try{await updateDoc(doc(itemsRef,item.id),{done:check.checked})}catch{check.checked=!check.checked;alert('Güncelleme başarısız')}};const label=document.createElement('div');label.className='name';const strong=document.createElement('strong');strong.textContent=item.name;label.append(strong);if(item.quantity){const small=document.createElement('small');small.textContent=' · '+item.quantity;label.append(small)}const del=document.createElement('button');del.className='danger';del.textContent='Sil';del.setAttribute('aria-label',item.name+' sil');del.onclick=async()=>{if(confirm('Bu ürünü listeden silmek istiyor musun?')){try{await deleteDoc(doc(itemsRef,item.id))}catch{alert('Silme başarısız')}}};div.append(check,label,del);$('items').append(div)}}
</script></body></html>
