<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087e73"><title>AlGel 4.0 · Test</title><link rel="stylesheet" href="../style.css"><style>.v4{max-width:650px;margin:auto;padding:18px}.v4 .panel{margin:12px 0}.v4 nav{display:flex;gap:8px;flex-wrap:wrap}.v4 nav button{flex:1}.v4 .row{flex-wrap:wrap}.v4 .small{font-size:12px;color:var(--muted)}.v4 .hidden{display:none}.v4 .itemline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.v4 .itemline button{padding:6px 10px}.v4 .notice{white-space:pre-wrap}</style></head><body><header><div class="wrap top"><div><div class="brand">🛍️ AlGel <span class="version">4.0 Test</span></div><small>Çok aileli geliştirme sürümü</small></div></div></header><main class="v4"><p id="notice" class="small notice" role="status"></p><section id="authPanel" class="panel"><h2>Giriş / Üyelik</h2><nav><button id="showLogin">Giriş yap</button><button id="showRegister" class="subtle">Üye ol</button></nav><form id="loginForm"><label>E-posta<input id="loginEmail" type="email" autocomplete="username" required></label><label>Şifre<input id="loginPassword" type="password" autocomplete="current-password" required></label><label><input id="remember" type="checkbox" checked style="display:inline;width:auto"> Beni hatırla</label><button class="full">Giriş yap</button><button id="resetPassword" type="button" class="subtle full">Şifremi unuttum</button></form><form id="registerForm" hidden><label>Görünen ad<input id="registerName" maxlength="60" required></label><label>Kullanıcı adı<input id="registerUsername" pattern="[a-z0-9_]{3,24}" placeholder="ornek_kullanici" required></label><label>E-posta<input id="registerEmail" type="email" required></label><label>Şifre<input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="full">Üye ol</button></form></section><section id="appPanel" hidden><div class="panel"><div class="row"><strong id="identity" class="grow"></strong><button id="logout" class="subtle">Çıkış</button></div><p id="verifyMessage" class="small"></p><button id="sendVerify" class="subtle" hidden>E-posta doğrulaması gönder</button></div><details class="panel"><summary>Profilim ve hesap ayarları</summary><form id="profileForm"><label>Görünen ad<input id="profileName" maxlength="60" required></label><label>Kullanıcı adı<input id="profileUsername" pattern="[a-z0-9_]{3,24}" required></label><button>Profili kaydet</button></form><hr><form id="emailForm"><label>Yeni e-posta<input id="newEmail" type="email" required></label><button>E-posta değişikliği doğrulaması gönder</button></form><button id="changePassword" class="subtle">Şifre sıfırlama e-postası gönder</button></details><div class="panel"><h2>Ailelerim</h2><label>Aktif aile<select id="familySelect"></select></label><form id="createFamily"><label>Yeni aile adı<input id="familyName" maxlength="60" placeholder="Örn. Yıldırım Ailesi" required></label><button class="full">Aile oluştur</button></form><div id="familyInfo" class="small"></div></div><section id="familyArea" hidden><div class="panel"><h2>Aile üyeleri</h2><div id="members"></div><form id="inviteForm"><label>Davet edilecek kişinin e-postası<input id="inviteEmail" type="email" required></label><button>48 saatlik davet oluştur</button></form><p id="inviteLink" class="small"></p></div><div class="panel"><h2>Alışveriş listeleri</h2><label>Liste<select id="listSelect"></select></label><form id="newListForm" class="row"><input id="newListName" class="grow" placeholder="Yeni liste adı" maxlength="60" required><button>+ Liste</button></form><form id="newItemForm"><label>Ürün<input id="itemName" maxlength="100" required></label><div class="row"><label class="grow">Miktar<input id="itemQuantity" type="number" min="0.01" step="any" value="1" required></label><label class="grow">Birim<select id="itemUnit"><option>adet</option><option>kg</option><option>g</option><option>litre</option><option>paket</option></select></label></div><button class="full">Ürün ekle</button></form><div id="items"></div><button id="shareList" class="subtle full">WhatsApp ile paylaş</button></div><div class="panel"><h2>Hızlı ürün kataloğu</h2><form id="catalogForm" class="row"><input id="catalogName" class="grow" placeholder="Ürün adı" required maxlength="100"><button>+ Kataloğa ekle</button></form><div id="catalog"></div></div><div class="panel"><h2>Liste istekleri</h2><label>Alıcı<select id="reminderRecipient"></select></label><label>Not<input id="reminderNote" maxlength="200" placeholder="Alışveriş listesi hazırlar mısın?"></label><button id="requestList" class="full">Liste iste</button><div id="reminders"></div></div></section></section></main><script type="module" src="./app.js"></script></body></html>
